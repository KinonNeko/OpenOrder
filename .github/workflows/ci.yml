# Build, vet and test on every push and pull request.
#
# Deliberately thin: every check lives in ./dev, which runs on a laptop. This
# machine has no Docker and no act, so a workflow that carried its own logic
# could not be exercised before pushing -- keeping the logic in a shell script
# means the only unverified part here is GitHub's own plumbing.
#
# Run the identical gate locally with:  ./dev ci
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # ./dev ci starts its own PostgreSQL when OD_TEST_POSTGRES_DSN is unset;
      # on a runner a service container is cheaper, so hand it one.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: opendiscord
          POSTGRES_PASSWORD: opendiscord
          POSTGRES_DB: opendiscord
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opendiscord"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # LiveKit is left to ./dev ci, which builds and starts it exactly as it
      # does locally. It fails the run if the voice suite then skips.
      - name: Run the gate
        env:
          OD_TEST_POSTGRES_DSN: postgres://opendiscord:opendiscord@127.0.0.1:5432/opendiscord?sslmode=disable
        run: ./dev ci
